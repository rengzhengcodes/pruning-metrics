[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pruning-metrics"
version = "0.1.0"
description = "Evaluation tooling for pruning-focused model experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.20.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pylint>=3.2.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

